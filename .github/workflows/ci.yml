# Continuous integration: every push, on any branch, must keep the module
# tidy, formatted, vet-clean, buildable and passing its tests.
name: CI

on: push

# This workflow only reads the repository, so the automatic GITHUB_TOKEN
# gets nothing beyond read access.
permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs on branches are cancelled; runs on main never are, so a
  # publish (and later a deploy) is never killed halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Verify, build and test
    runs-on: ubuntu-latest
    # The default job limit is 6 hours; a deadlocked test must not burn that.
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the Go version.
          go-version-file: go.mod
          # setup-go v6+ keys the module cache on go.mod by default;
          # go.sum fingerprints the exact dependency contents.
          cache-dependency-path: go.sum

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Check formatting
        # gofmt -l always exits 0, so the step has to fail explicitly,
        # and it lists the offending files so the log says what to fix.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -count=1 disables Go's test result cache: CI must actually run the
        # tests on every push, not replay a result saved by an earlier run.
        run: go test -race -count=1 ./...
  publish:
    name: Publish ${{ matrix.service }} image
    # Runs only after the test job above passed...
    needs: test
    # ...and only for pushes to main: branches are verified, never published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the workflow-level ones entirely, so
    # contents:read has to be repeated next to packages:write.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, consumer, priceservice]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          # Registry paths must be lowercase, so the owner name cannot come
          # from github.repository (GabrielHKGodinho) as-is.
          tags: |
            ghcr.io/gabrielhkgodinho/investment-engine-${{ matrix.service }}:latest
            ghcr.io/gabrielhkgodinho/investment-engine-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
  deploy:
    name: Deploy to Railway
    # Waits for all three publish jobs of the matrix to succeed.
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job talks only to Railway: the GitHub token gets no permissions.
    permissions: {}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Redeploy services
        # A redeploy pulls :latest again and picks up the image just published.
        # The price service goes first because the consumer calls it.
        run: |
          for service in priceservice consumer api; do
            npx -y @railway/cli@5 redeploy --service "$service" --yes
          done