openapi: 3.0.3
info:
  title: Investment Engine API
  description: >
    An event-driven order execution and portfolio management system,
    built to practice distributed systems patterns in Go.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /orders:
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetSymbol
                - quantity
                - side
                - executionType
              properties:
                assetSymbol:
                  type: string
                  example: "PETR4"
                quantity:
                  type: integer
                  minimum: 1
                side:
                  type: string
                  enum: [BUY, SELL]
                executionType:
                  type: string
                  enum: [MARKET, LIMIT]
                limitPrice:
                  type: number
                  format: double
                  description: Required only when executionType is LIMIT
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderID:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, EXECUTED, CANCELLED, REJECTED]
        '400':
          description: Invalid request body
    get:
      summary: List orders for the authenticated user
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation token from a previous response's nextCursor
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, EXECUTED, CANCELLED, REJECTED]
        - name: side
          in: query
          schema:
            type: string
            enum: [BUY, SELL]
        - name: executionType
          in: query
          schema:
            type: string
            enum: [MARKET, LIMIT]
        - name: assetSymbol
          in: query
          schema:
            type: string
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        orderID:
                          type: string
                          format: uuid
                        assetSymbol:
                          type: string
                        quantity:
                          type: integer
                        side:
                          type: string
                          enum: [BUY, SELL]
                        executionType:
                          type: string
                          enum: [MARKET, LIMIT]
                        status:
                          type: string
                          enum: [PENDING, EXECUTED, CANCELLED, REJECTED]
                        createdAt:
                          type: string
                          format: date-time
                  nextCursor:
                    type: string
                    nullable: true
                  hasMore:
                    type: boolean